<title>可可的鱼儿</title>

<style>
:root{
  --wall:#f3e9da; --ink:#3a2a33; --cream:#fffaf2;
  --b1:#ff9a4a; --b1d:#d9692a;
  --b2:#c98b5a; --b2d:#8f5a35;
  --b3:#f6cf3e; --b3d:#c99a1c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color-scheme:light;background:var(--wall);overflow:hidden;overscroll-behavior:none}
body{
  display:flex;flex-direction:column;height:100%;
  padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
#stage{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;background:#f3e9da}
canvas{display:block;touch-action:manipulation}
#hud{position:absolute;top:8px;left:10px;display:flex;gap:6px;pointer-events:none}
.chip{background:rgba(255,250,242,.92);border:2px solid var(--ink);border-radius:4px;padding:2px 7px;font-size:13px;font-weight:700;color:var(--ink);box-shadow:0 2px 0 var(--ink)}
#reset{position:absolute;top:8px;right:52px;height:30px;border:2px solid var(--ink);border-radius:4px;background:rgba(255,250,242,.92);font-family:inherit;font-size:13px;font-weight:800;color:var(--ink);line-height:1;box-shadow:0 2px 0 var(--ink);padding:0 8px}
#reset.armed{background:#e2607a;color:#fff}
#mute{position:absolute;top:8px;right:10px;width:34px;height:30px;border:2px solid var(--ink);border-radius:4px;background:rgba(255,250,242,.92);font-size:16px;line-height:1;box-shadow:0 2px 0 var(--ink);padding:0}
#toast{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:6px 12px;border-radius:4px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#bar{
  display:flex;gap:10px;padding:10px 12px 12px;
  background:#c99a6b;border-top:3px solid var(--ink);
  background-image:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.08) 46px 48px);
}
#bar button{
  flex:1;min-width:0;height:72px;border:3px solid var(--ink);border-radius:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:inherit;color:var(--ink);font-weight:800;font-size:15px;line-height:1.05;
  box-shadow:0 5px 0 var(--ink), inset 0 -5px 0 rgba(0,0,0,.15), inset 0 3px 0 rgba(255,255,255,.45);
  transform:translateY(0);transition:transform .05s, box-shadow .05s;padding:4px 2px 7px;
}
#bar button:active,#bar button.press{transform:translateY(4px);box-shadow:0 1px 0 var(--ink), inset 0 -3px 0 rgba(0,0,0,.15), inset 0 3px 0 rgba(255,255,255,.45)}
#bar button small{font-size:10px;font-weight:700;opacity:.75}
#bar img{width:30px;height:30px;image-rendering:pixelated}
#bFish{background:var(--b1)} #bFood{background:#e8b07a} #bLily{background:var(--b3)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-label="Fish tank game"></canvas>
  <div id="hud"><span class="chip" id="cFish">🐟 0</span><span class="chip" id="cLily">🌼 0</span></div>
  <button id="reset" aria-label="Reset the tank">↺ 重置</button>
  <button id="mute" aria-label="Sound on or off">🔊</button>
  <div id="toast"></div>
</div>
<div id="bar">
  <button id="bFish"><img id="iFish" alt="">加鱼<small>Add fish</small></button>
  <button id="bFood"><img id="iFood" alt="">喂食<small>Feed</small></button>
  <button id="bLily"><img id="iLily" alt="">百合花<small>Lily</small></button>
</div>

  if(food.length){ // swim to nearest food
    let best=null,bd=1e9;
    for(const p of food){const d=(p.x-f.x)**2+(p.y-f.y)**2; if(d<bd){bd=d;best=p}}
    if(best){tx=best.x-f.face*4;ty=best.y-2;sp=20;
      const mx=f.x+(f.face>0?9:0), my=f.y+2;
      if(Math.abs(mx-best.x)<2.2&&Math.abs(my-best.y)<2.2){
        food.splice(food.indexOf(best),1); hearts.push({x:f.x+4,y:f.y-3,t:0,small:1}); sfx('gulp');
      }}
  } else { f.t-=dt; if(f.t<=0||Math.hypot(tx-f.x,ty-f.y)<2)pickTarget(f) }
  const dx=tx-f.x, dy=ty-f.y, d=Math.hypot(dx,dy)||1;
  const ax=dx/d*sp, ay=dy/d*sp*.6;
  f.vx+=(ax-f.vx)*Math.min(1,dt*2.2); f.vy+=(ay-f.vy)*Math.min(1,dt*2.2);
  if(f.drop){f.vy=Math.max(f.vy,10); f.drop-=dt; if(f.drop<0)f.drop=0}
  f.x+=f.vx*dt; f.y+=f.vy*dt+Math.sin(f.wig*1.3)*dt*1.2;
  f.x=Math.max(WX0()+1,Math.min(WX1()-11,f.x));
  f.y=Math.max(WY0()+1,Math.min(fishMaxY(f.x+5),f.y));
  if(f.vx>1.5)f.face=1; else if(f.vx<-1.5)f.face=-1;
  f.wig+=dt*(4+Math.abs(f.vx)*.5);
}
function drawFish(f){
  const pal=VARIANTS[f.v]; const map=(Math.sin(f.wig*2)>0)?FISH_MAP_A:FISH_MAP_B;
  const x=Math.round(f.x), y=Math.round(f.y);
  drawMap(b,map,pal,x,y,f.face<0);
  if(pal.patch){b.fillStyle=pal.patch; const c=f.face>0?[4,5]:[4,5].map(k=>9-k); b.fillRect(x+c[0],y+1,1,2);b.fillRect(x+c[1],y+2,1,1)}
}

// ---------- lilies ----------
const POTS=[]; let lilies=[];
const MAX_BLOOM=3;
function placePots(){
  POTS.length=0;
  const top=BY+122, bot=H-3;
  const yA=Math.round(top+(bot-top)*.45), yB=bot;
  [58,82,106,126].forEach(x=>POTS.push({x,y:yA}));
  [70,94,118].forEach(x=>POTS.push({x,y:yB}));
  if(H-GY<0)return;
}
const LILY=[
".....y.....",
"....yYy....",
"y...yYy...y",
"yy.byYyb.yy",
".yYyYoYyYy.",
"..yYobboYy.",
".yYYoboYYy.",
"yyy.yYy.yyy",
"....yyy....",
".....y.....",
];
const LILY_PAL={y:'#f5c518',Y:'#ffe680',o:'#f08c22',b:'#7a4628'};
const BUD=["g","Y","y"];
function drawLilyPot(p,n,tt){
  const x=p.x,y=p.y;
  // pot
  const pot=[
  "kkkkkkkkk",
  "kwwwwwwwk",
  ".kwwwwwk.",
  ".kwwwwsk.",
  "..kwwsk..",
  "..kkkkk..",
  ];
  // leaves
  b.fillStyle='#4f8f3a';
  b.fillRect(x+3,y-16,1,11); b.fillRect(x+1,y-12,1,7); b.fillRect(x+6,y-14,1,9); b.fillRect(x+2,y-17,1,3); b.fillRect(x+7,y-15,1,2);
  b.fillStyle='#6fb24f'; b.fillRect(x+1,y-8,1,3); b.fillRect(x+7,y-9,1,4); b.fillRect(x+3,y-12,1,4);
  const heads=[[x-1,y-33,0],[x+5,y-26,1],[x-6,y-23,-1]];
  for(let i=0;i<n;i++){
    const [hx,hy,s]=heads[i]; const sway=Math.round(Math.sin(tt*1.4+p.x+i)*.6);
    b.fillStyle='#4f8f3a';
    const sx=x+4, ex=hx+5+sway;
    for(let yy=hy+9;yy<y-5;yy++){const k=(yy-(hy+9))/((y-5)-(hy+9)); b.fillRect(Math.round(ex+(sx-ex)*k),yy,1,1)}
    drawMap(b,LILY,LILY_PAL,hx+sway,hy,false);
  }
  drawMap(b,pot,{k:'#3a2a33',w:'#fbf7f0',s:'#e3dacb'},x,y-6,false);
}

// ---------- girl ----------
const girl={blinkT:2.5,blink:0,sipT:7,sip:0,talk:0,bounce:0};
function girlRect(){return {x:GX,y:GY,w:47,h:104}}
function updateGirl(dt){
  girl.bounce+=dt;
  girl.blinkT-=dt; if(girl.blinkT<=0){girl.blink=.16;girl.blinkT=2.5+Math.random()*3}
  if(girl.blink>0)girl.blink-=dt;
  if(girl.talk<=0){girl.sipT-=dt; if(girl.sipT<=0){girl.sip=1.3;girl.sipT=9+Math.random()*6}}
  if(girl.sip>0){const was=girl.sip; girl.sip-=dt; if(was>0.35&&girl.sip<=0.35)hearts.push({x:GX+42,y:GY+20,t:0})}
  if(girl.talk>0)girl.talk-=dt;
}
function drawGirl(){
  const up=(Math.floor(girl.bounce*1.6)%2)?1:0;
  let s=img.girl_idle, dx=0, dy=0;
  if(girl.talk>0){ s=(Math.floor(girl.talk*7)%2)?img.girl_talk:img.girl_idle; }
  else if(girl.sip>0){ s=img.girl_sip; dx=1; dy=-1; }
  else if(girl.blink>0){ s=img.girl_blink; dx=1; dy=-1; }
  b.drawImage(s,GX+dx,GY+dy-up);
  if(girl.talk>0) drawBubble();
}
function drawBubble(){
  const pop=Math.min(1,(1.9-girl.talk)*8);
  const bx=GX+40, by=GY-8, w=31, h=22;
  if(pop<1&&pop<.5)return;
  const k='#3a2a33';
  px('#fff',bx+1,by+1,w-2,h-2);
  px(k,bx+2,by,w-4,1);px(k,bx+2,by+h-1,w-4,1);px(k,bx,by+2,1,h-4);px(k,bx+w-1,by+2,1,h-4);
  px(k,bx+1,by+1);px(k,bx+w-2,by+1);px(k,bx+1,by+h-2);px(k,bx+w-2,by+h-2);
  // tail toward her mouth
  px('#fff',bx+2,by+h-1,4,1); px('#fff',bx+1,by+h,3,1);px('#fff',bx,by+h+1,2,1);
  px(k,bx+6,by+h-1);px(k,bx+4,by+h);px(k,bx+2,by+h+1);px(k,bx-1,by+h+2,2,1);px(k,bx-1,by+h+1);px(k,bx,by+h);
  b.drawImage(img.glyph,bx+4,by+3);
}

// ---------- hearts / bubbles ----------
const HEART=[".p.p.","ppppp","ppppp",".ppp.","..p.."];
const HEART_S=["p.p","ppp",".p."];
function drawHearts(dt){
  for(let i=hearts.length-1;i>=0;i--){const h=hearts[i]; h.t+=dt; if(h.t>1.4){hearts.splice(i,1);continue}
    const y=Math.round(h.y-h.t*10), x=Math.round(h.x+Math.sin(h.t*5)*1.5);
    b.globalAlpha=Math.max(0,1-(h.t/1.4)**2);
    drawMap(b,h.small?HEART_S:HEART,{p:'#f47d9a'},x,y,false);
    b.globalAlpha=1;}
}

// ---------- update/render ----------
let last=0,clock=0,bubT=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0); last=ts; clock+=dt;
  if(!staticLayer)buildStatic();
  b.clearRect(0,0,W,H);
  b.drawImage(staticLayer,0,0);
  // water layer
  b.save(); b.beginPath(); b.rect(WX0(),WY0(),WX1()-WX0(),BY+86-WY0()); b.clip();
  bubT-=dt; if(bubT<=0){bubT=.25+Math.random()*.35; bubbles.push({x:BX+16+Math.random()*2,y:BY+76,s:Math.random()<.3?2:1})}
  for(let i=bubbles.length-1;i>=0;i--){const u=bubbles[i]; u.y-=dt*(10+u.s*3); u.x+=Math.sin(u.y*.6)*.08;
    if(u.y<WY0()+1){bubbles.splice(i,1);continue}
    px('#e9fbff',Math.round(u.x),Math.round(u.y),u.s,u.s); if(u.s>1)px('#9fdcf2',Math.round(u.x)+1,Math.round(u.y)+1);}
  for(let i=food.length-1;i>=0;i--){const p=food[i]; const fl=floorAt(p.x)-1;
    if(p.y<fl){p.y+=dt*(4+p.k); p.x+=Math.sin(clock*2+p.k*9)*dt*1.5}else{p.rest+=dt; if(p.rest>12){food.splice(i,1);continue}}
    px(p.c,Math.round(p.x),Math.round(p.y),p.w,1);}
  for(const f of fish){updateFish(f,dt);drawFish(f)}
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i]; r.t+=dt; if(r.t>.6){ripples.splice(i,1);continue}
    const w=Math.round(2+r.t*14); px('rgba(255,255,255,.85)',Math.round(r.x-w/2),WY0(),w,1)}
  b.restore();
  // lilies, back row then front row
  const tot=lilies.reduce((a,c)=>a+c,0);
  POTS.forEach((p,i)=>{ if(lilies[i])drawLilyPot(p,lilies[i],clock) });
  updateGirl(dt); drawGirl();
  drawHearts(dt);
  // blit
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(buf,0,0,cv.width,cv.height);
  requestAnimationFrame(frame);
}

// ---------- actions ----------
const MAX_FISH=36;
function addFish(){
  if(fish.length>=MAX_FISH){toast('鱼缸满啦 Tank is full!');return}
  const f=newFish(undefined,true); fish.push(f); ripples.push({x:f.x+5,t:0});
  for(let i=0;i<5;i++)bubbles.push({x:f.x+2+Math.random()*6,y:f.y+4+Math.random()*4,s:1});
  sfx('plop'); save(); hud();
}
function feed(){
  const n=6+Math.floor(Math.random()*3);
  const cx=WX0()+12+Math.random()*(WX1()-WX0()-24);
  for(let i=0;i<n;i++){food.push({x:cx+(Math.random()-.5)*22,y:WY0()+1+Math.random()*2,k:Math.random()*2,rest:0,w:Math.random()<.5?2:1,
    c:['#8a4b2a','#b0602e','#6e3a22','#c9813f'][i%4]})}
  ripples.push({x:cx,t:0}); sfx('sprinkle');
}
function addLily(){
  const total=lilies.reduce((a,c)=>a+c,0);
  if(total>=POTS.length*MAX_BLOOM){toast('花开满啦 So many lilies!');return}
  // fill every pot with one bloom first, then add more blooms
  let idx=-1, min=99;
  for(let i=0;i<POTS.length;i++){const c=lilies[i]||0; if(c<min){min=c;idx=i}}
  lilies[idx]=(lilies[idx]||0)+1;
  const p=POTS[idx]; hearts.push({x:p.x+2,y:p.y-30,t:0,small:1});
  sfx('chime'); save(); hud();
}
function tapGirl(){
  girl.talk=1.9; girl.sip=0;
  hearts.push({x:GX+36,y:GY+4,t:0}); hearts.push({x:GX+8,y:GY+10,t:-.25,small:1});
  sayGuai();
}

// ---------- sound ----------
let ac=null, muted=false;
function audio(){ if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(ac&&ac.state==='suspended')ac.resume(); return ac }
function tone(f0,f1,dur,type='sine',vol=.18,delay=0){
  const a=audio(); if(!a||muted)return; const t=a.currentTime+delay;
  const o=a.createOscillator(), g=a.createGain(); o.type=type;
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
function sfx(k){
  if(k==='plop'){tone(700,160,.18,'sine',.25)}
  if(k==='sprinkle'){for(let i=0;i<5;i++)tone(1800+Math.random()*900,1200,.05,'triangle',.06,i*.05)}
  if(k==='gulp'){tone(420,260,.07,'square',.04)}
  if(k==='chime'){tone(880,880,.25,'triangle',.12);tone(1320,1320,.3,'triangle',.08,.08)}
}
let zhVoice=null;
function findVoice(){ try{const v=speechSynthesis.getVoices(); zhVoice=v.find(x=>/zh[-_](CN|TW|HK)/i.test(x.lang)&&/female|Tingting|Meijia|Sinji|Li-mu|婷婷|美佳/i.test(x.name))||v.find(x=>/^zh/i.test(x.lang))||null}catch(e){} }
try{ findVoice(); speechSynthesis.onvoiceschanged=findVoice }catch(e){}
function sayGuai(){
  if(muted)return;
  tone(988,1320,.08,'triangle',.08);
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance('乖~'); u.lang='zh-CN'; if(zhVoice)u.voice=zhVoice; u.pitch=1.7; u.rate=.85; u.volume=1;
    speechSynthesis.speak(u);
  }catch(e){}
}

// ---------- ui ----------
const $=id=>document.getElementById(id);
function hud(){ $('cFish').textContent='🐟 '+fish.length; $('cLily').textContent='🌼 '+lilies.reduce((a,c)=>a+c,0) }
let toastT=0; function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1400)}
function bind(id,fn){const el=$(id); el.addEventListener('pointerdown',e=>{e.preventDefault();audio();el.classList.add('press');fn()});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>el.classList.remove('press')));}
bind('bFish',addFish); bind('bFood',feed); bind('bLily',addLily);
// reset needs a second tap within 2.5s, so a stray tap can't wipe the tank
let resetArm=0;
$('reset').addEventListener('pointerdown',e=>{e.preventDefault();audio();const el=$('reset');
  if(!resetArm){el.classList.add('armed');el.textContent='再按一次';toast('再按一次重置 Tap again to reset');
    resetArm=setTimeout(()=>{resetArm=0;el.classList.remove('armed');el.textContent='↺ 重置'},2500);return}
  clearTimeout(resetArm);resetArm=0;el.classList.remove('armed');el.textContent='↺ 重置';
  fish=[0,1,2,3,0,4,2,1].map(v=>newFish(v));lilies=[];food.length=0;hearts.length=0;
  save();hud();sfx('plop');toast('重置好了 Tank reset!');
});
$('mute').addEventListener('pointerdown',e=>{e.preventDefault();muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{speechSynthesis.cancel()}catch(_){}});
cv.addEventListener('pointerdown',e=>{
  audio();
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  const g=girlRect();
  if(x>=g.x+2&&x<=g.x+g.w-2&&y>=g.y&&y<=g.y+g.h){tapGirl();return}
});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});

// ---------- save ----------
function save(){ try{localStorage.setItem('bobaTank',JSON.stringify({fish:fish.map(f=>f.v),lilies}))}catch(e){} }
function load(){
  let d=null; try{d=JSON.parse(localStorage.getItem('bobaTank')||'null')}catch(e){}
  if(d&&Array.isArray(d.fish)){fish=d.fish.slice(0,MAX_FISH).map(v=>newFish(v%VARIANTS.length));lilies=(d.lilies||[]).slice(0,7)}
  else{fish=[0,1,2,3,0,4,2,1].map(v=>newFish(v));lilies=[]}
}

// icons for the buttons, drawn with the same pixel art
function icon(draw){const c=document.createElement('canvas');c.width=12;c.height=12;const g=c.getContext('2d');draw(g);return c.toDataURL()}
function makeIcons(){
  $('iFish').src=icon(g=>drawMap(g,FISH_MAP_A,VARIANTS[0],1,3,false));
  $('iFood').src=icon(g=>drawMap(g,[
    "....kkk.....",
    "...kyyyk....",
    "..kkkkkkk...",
    "..kwrrrwk...",
    "..kwrrrwk.b.",
    "..kwwwwwk..b",
    "..kwrrrwk.b.",
    "..kwwwwwk...",
    "..kkkkkkk..b",
  ],{k:'#3a2a33',y:'#f6c935',w:'#fff7ec',r:'#e2607a',b:'#8a4b2a'},0,1,false));
  $('iLily').src=icon(g=>{g.fillStyle='#4f8f3a';g.fillRect(6,9,1,3);g.fillRect(4,10,2,1);g.fillRect(7,11,2,1);drawMap(g,LILY,LILY_PAL,1,0,false)});
}

function start(){
  layout(); load(); hud(); makeIcons();
  window.__tank={addFish,feed,addLily,tapGirl,get fish(){return fish},get lilies(){return lilies}};
  requestAnimationFrame(frame);
}
let rt=0; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{layout();fish.forEach(f=>{f.y=Math.min(f.y,fishMaxY(f.x));pickTarget(f)})},60)});
})();
</script>
